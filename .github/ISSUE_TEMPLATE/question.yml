name: ❓ Question / help
description: Ask how to do something with paybot-sdk
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What are you trying to do?
      description: Describe your goal and what you've tried.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      placeholder: "Relevant code, versions, or links."
    validations:
      required: false
