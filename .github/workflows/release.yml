name: Release

# Publishes paybot-sdk to npm. Decoupled from CI per the clean-release policy:
# ordinary pushes to main run build + tests + security only (ci.yml), and the
# OSV-Scanner / CodeQL security gate is the authoritative verdict for `main`.
# Publishing is a DELIBERATE act, triggered only when a GitHub Release is
# published — so the npm publish step can only run (and only fail) when you
# intentionally cut a version, never on every commit.
#
# Idempotent: a skip-if-already-published guard makes re-runs safe (no E409 on
# a version that is already live). A tag/version consistency check fails fast
# if the Release tag (e.g. v0.3.0) does not match package.json.
#
# Requires repo secret NPM_TOKEN: an npm "Automation" (or granular) token with
# publish rights to the `paybot-sdk` package. Rotate it if publishes 404 — npm
# returns 404 (not 403) when the token lacks publish permission.
#
# Actions pinned to immutable SHAs per supply-chain hygiene policy (paybot-sdk
# PR #11). Adjacent version comment marks floating-tag intent for Dependabot.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # required for `npm publish --provenance` (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # NOTE: does NOT set persist-credentials: false — `npm publish --provenance`
      # needs the OIDC-issued token available for the duration of the publish step.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::Release tag '$GITHUB_REF_NAME' (=> $TAG) does not match package.json version '$PKG_VERSION'."
            exit 1
          fi
          echo "Releasing paybot-sdk@$PKG_VERSION"

      - run: npm ci
      - run: npm run build

      - name: Skip if version already published
        id: guard
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if npm view "paybot-sdk@${PKG_VERSION}" version >/dev/null 2>&1; then
            echo "paybot-sdk@${PKG_VERSION} is already on npm — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.guard.outputs.skip == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
